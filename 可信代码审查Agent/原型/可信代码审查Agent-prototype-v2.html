<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可信代码审查 Agent · 工作台 v2</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#172033; --muted:#5a6678; --line:#e6eaf0; --panel:#fff; --canvas:#f5f7fb;
    --nav:#111a2e; --accent:#2e6bff; --teal:#0f766e; --amber:#9a5b06; --red:#c94d5d;
    --st-done:#14796d; --st-run:#2456c6; --st-block:#b4432c; --faint:#5f6b7c;
    --done-bg:#ecf9f2; --done-fg:#14796d; --run-bg:#eff6ff; --run-fg:#2456c6;
    --block-bg:#fff4f0; --block-fg:#b4432c; --todo-bg:#f4f6f9; --todo-fg:#6b7789;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}
  button,select,input{font:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}
  .app{min-height:100vh;display:flex}

  /* ---------- 侧栏 ---------- */
  .sidebar{width:236px;flex:0 0 236px;background:var(--nav);color:#d9e1f3;padding:20px 12px 46px;display:flex;flex-direction:column;gap:22px}
  .brand{display:flex;gap:10px;align-items:center;padding:0 8px}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:#eaf1ff;color:#1c57da;display:grid;place-items:center}
  .brand-title{font-size:14px;font-weight:800;color:#fff}
  .brand-sub{font-size:10px;color:#93a6c8;margin-top:2px}
  .nav-title{font-size:10px;color:#6f81a4;letter-spacing:.08em;text-transform:uppercase;padding:0 10px;margin-bottom:6px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{border:0;background:transparent;color:#b7c4dc;padding:9px 11px;border-radius:8px;display:flex;align-items:center;gap:9px;text-align:left;font-size:12.5px;width:100%}
  .nav button:hover{background:#1c2a44;color:#fff}
  .nav button.active{background:#263653;color:#fff;font-weight:600}
  .nav button svg{opacity:.8;flex:0 0 auto}
  .nav button .count{margin-left:auto;font-size:10px;background:#2d3d5c;color:#a9bada;border-radius:9px;padding:1px 6px}
  .nav button.active .count{background:#3b527c;color:#dbe7ff}
  .sidebar-bottom{margin-top:auto;border-top:1px solid #25334d;padding:14px 8px 0;font-size:10.5px;color:#8496b5;line-height:1.6}

  /* ---------- 顶栏 ---------- */
  .main{flex:1;min-width:0}
  .topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
  .crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .crumb b{color:var(--ink);font-weight:700}
  .top-right{display:flex;align-items:center;gap:10px}
  .role-select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:11.5px;color:#344054;background:#fff}
  .avatar{width:30px;height:30px;border-radius:50%;background:#dbe7ff;color:#1e56ca;display:grid;place-items:center;font-size:11px;font-weight:700}
  .content{padding:24px 26px 88px;max-width:1400px;margin:0 auto}

  /* ---------- 通用 ---------- */
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  .eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:7px}
  h1{font-size:23px;margin:0;letter-spacing:-.02em}
  h2{font-size:15px;margin:0}
  .subtitle{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.6}
  .btn{border:1px solid var(--line);background:#fff;color:#334155;border-radius:7px;padding:8px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#b8c6dd;background:#f9fbff}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#245be0}
  .btn-ok{background:#0d8f7f;border-color:#0d8f7f;color:#fff}
  .btn-ok:hover{background:#0a7a6c}
  .btn-danger{color:#a3382c;border-color:#f2c9d0;background:#fff7f8}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:5px 9px;font-size:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 7px rgba(22,34,58,.025);overflow:hidden}
  .table-wrap{overflow-x:auto;overscroll-behavior-x:contain}
  .card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card-t{font-size:13px;font-weight:700}
  .card-note{color:var(--muted);font-size:11px}
  .card-b{padding:14px 16px}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.85fr);gap:14px;align-items:start}
  .stack{display:grid;gap:14px}
  .muted{color:var(--muted)}
  .mono{font-family:Consolas,Menlo,monospace}

  /* ---------- 指标 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .kpi{padding:14px 16px}
  .kpi-l{color:var(--muted);font-size:11px}
  .kpi-v{font-size:22px;font-weight:750;margin-top:5px;letter-spacing:-.02em}
  .kpi-m{margin-top:6px;font-size:11px;color:var(--teal)}
  .kpi-m.warn{color:var(--amber)}

  /* ---------- 表格 ---------- */
  .tbl{width:100%;min-width:820px;border-collapse:collapse}
  .tbl th{text-align:left;font-size:10.5px;color:var(--faint);font-weight:600;background:#fafbfc;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 14px;border-top:1px solid #eef1f5;vertical-align:middle;font-size:12px}
  .tbl th:last-child,.tbl td:last-child{text-align:right;white-space:nowrap;width:1%}
  .tbl .btn{white-space:nowrap}
  .tbl tr.row{cursor:pointer}
  .tbl tr.row:hover{background:#eef4ff}
  .repo{font-weight:700;color:#243148}
  .sub{color:var(--muted);font-size:11px;margin-top:3px}

  /* ---------- 徽标 / 状态 ---------- */
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}
  .pill.done{color:var(--done-fg);background:var(--done-bg)}
  .pill.running{color:var(--run-fg);background:var(--run-bg)}
  .pill.blocked{color:var(--block-fg);background:var(--block-bg)}
  .pill.todo{color:var(--todo-fg);background:var(--todo-bg)}
  .sev{font-size:10px;font-weight:750;border-radius:5px;padding:3px 6px}
  .sev.high{color:#ab3045;background:#fff0f2}
  .sev.medium{color:#9b680c;background:#fff7e4}
  .sev.low{color:#4470aa;background:#edf4ff}

  /* ---------- 阶段进度条（列表） ---------- */
  .stagebar{display:flex;gap:3px;align-items:center}
  .stagebar i{display:block;width:16px;height:5px;border-radius:3px;background:#e3e8ef}
  .stagebar i.done{background:#26a69a}
  .stagebar i.running{background:var(--st-run)}
  .stagebar i.blocked{background:var(--st-block)}
  .stagebar-note{font-size:10.5px;color:var(--muted);margin-top:5px}

  /* ---------- 阶段卡 ---------- */
  .stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stage{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
  .stage:hover{border-color:#b9c6dd}
  .stage.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,107,255,.12)}
  .stage.todo{background:#fbfcfd}
  .stage.blocked{background:#fffaf8;border-color:#f3d2c8}
  .stage-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
  .stage-dot{width:7px;height:7px;border-radius:50%;background:#c7cfdb}
  .stage.done .stage-dot{background:#26a69a}
  .stage.running .stage-dot{background:var(--st-run)}
  .stage.blocked .stage-dot{background:var(--st-block)}
  .stage-s{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45;min-height:26px}
  .stage-t{font-size:10px;color:var(--faint);margin-top:4px;font-family:Consolas,monospace;font-weight:500}
  .stage.done{background:var(--done-bg);border-color:#cfeade}
  .stage.running{background:var(--run-bg);border-color:#c9dcff}

  /* ---------- 下一步提示 ---------- */
  .nextstep{display:flex;align-items:center;gap:10px;border:1px dashed #c9d6ea;background:#f8fbff;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:12px}
  .nextstep b{color:#1e56ca}
  .nextstep .btn{margin-left:auto}

  /* ---------- 标签页 ---------- */
  .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .tab{border:0;background:none;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
  .tab.on{color:var(--accent);font-weight:700}
  .tab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}

  /* ---------- 发现 ---------- */
  .finding{display:flex;gap:10px;padding:13px 15px;border-bottom:1px solid #eef1f5;cursor:pointer}
  .finding:last-child{border-bottom:0}
  .finding:hover{background:#f8fbff}
  .finding-t{font-weight:700;font-size:12.5px}
  .finding-d{color:#566274;font-size:11.5px;line-height:1.55;margin-top:5px}
  .finding-l{color:#1f5ece;font-size:10.5px;margin-top:6px;font-family:Consolas,monospace}

  /* ---------- 抽屉 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.28);z-index:55;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(30,42,66,.12);transform:translateX(100%);transition:transform .2s ease;z-index:60;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .drawer-b{padding:16px 18px 40px;overflow:auto}
  .close{border:0;background:none;font-size:18px;color:#7d8796;line-height:1;width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
  .close:hover{background:#f1f4f9;color:#334155}
  :where(button,a,select,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sidebar :focus-visible{outline-color:#8fb4ff}
  .tbl tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:#f5f9ff}
  .btn.btn-danger:hover{background:#fff0f2;border-color:#e9aab5;color:#a3382c}
  .btn:disabled{opacity:1;background:#f2f4f7;border-color:#e4e7ec;color:#98a2b3}

  /* ---------- 代码块 ---------- */
  .code{background:#101827;color:#d6e2f5;border-radius:8px;padding:12px 14px;font-family:Consolas,monospace;font-size:11px;line-height:1.65;white-space:pre-wrap;overflow:auto}
  .code .add{color:#8fe3a8;background:#16331f;display:block}
  .code .del{color:#ff9f9f;background:#3d2029;display:block}
  .code .ln{display:block}
  .code .hot{background:#4b2632;margin:0 -14px;padding:0 14px}

  /* ---------- 矩阵 ---------- */
  .matrix{width:100%;border-collapse:collapse;font-size:12px}
  .matrix th,.matrix td{border:1px solid var(--line);padding:9px 12px;text-align:left}
  .matrix th{background:#fafbfc;font-size:11px;color:#7e899a;font-weight:600}
  .yes{color:#0d8f7f;font-weight:700}
  .no{color:#b9c1cd}

  /* ---------- 其他 ---------- */
  .empty{color:var(--muted);text-align:center;padding:34px 16px;font-size:12px}
  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#172033;color:#fff;padding:9px 14px;border-radius:7px;font-size:12px;z-index:80;transition:.2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #eef1f5;font-size:12px}
  .kv:last-child{border-bottom:0}
  .kv > span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:600}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{position:relative;padding:0 0 14px 18px;border-left:1px solid #e3e8ef;font-size:12px}
  .tl li:last-child{border-left-color:transparent;padding-bottom:0}
  .tl li:before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:#26a69a}
  .tl small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
  .warnbox{border:1px solid #f5dfaa;background:#fff8e8;color:#7d5b15;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.6}
  .infobox{border:1px solid #d6e4ff;background:#f4f8ff;color:#2b4a86;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.6}
  .rule{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #eef1f5}
  .rule:last-child{border-bottom:0}
  .rule-t{font-weight:650;font-size:12.5px}
  .rule-d{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.5}
  .switch{position:relative;width:34px;height:19px;border-radius:99px;background:#d7dee9;border:0;flex:0 0 auto;transition:.15s}
  .switch:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:#0d8f7f}
  .switch.on:after{left:17px}

  @media (max-width:1100px){
    .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-2,.split{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:900px){
    .sidebar{width:60px;flex:0 0 60px;padding:14px 6px;gap:14px;align-items:center}
    .brand{justify-content:center;padding:0}
    .brand>div,.nav-title,.sidebar-bottom,.nav button span,.nav button .count{display:none}
    .nav{width:100%}
    .nav button{justify-content:center;padding:10px 0}
    .topbar{padding:0 12px;height:56px}
    .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-user{display:none}
    .role-select{max-width:108px;font-size:11px;padding:5px 6px}
    #logoutBtn{padding:5px 8px}
  }
  @media (max-width:720px){
    .content{padding:18px 14px 60px}
    .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
    .page-head{flex-direction:column}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .drawer{width:100vw}
    .login-points{display:none}
  }

  /* ---------- 登录 ---------- */
  .login-page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(400px,.95fr);background:var(--canvas)}
  .login-hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#0d1b3a 0%,#16305e 55%,#1d4ed8 120%);color:#fff;padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between}
  .login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.14);pointer-events:none}
  .login-hero:before{width:520px;height:520px;right:-200px;top:-180px}
  .login-hero:after{width:340px;height:340px;right:-70px;bottom:-170px;background:rgba(255,255,255,.05)}
  .login-brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
  .login-brand .brand-mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .login-brand b{display:block;font-size:14px;letter-spacing:.2px}
  .login-brand span{display:block;font-size:10.5px;color:rgba(255,255,255,.6);margin-top:2px}
  .login-copy{position:relative;z-index:1;max-width:520px;margin:40px 0}
  .login-kicker{display:inline-block;font-size:10px;letter-spacing:.18em;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase}
  .login-copy .login-kicker{color:#a8c4ff}
  .login-copy h1{font-size:38px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:14px 0 16px}
  .login-copy p{font-size:13.5px;line-height:1.9;color:rgba(255,255,255,.76);max-width:430px}
  .login-points{margin-top:34px;border-top:1px solid rgba(255,255,255,.14);max-width:460px}
  .login-points>div{display:grid;grid-template-columns:30px 110px 1fr;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
  .login-points span{font-size:10px;color:#8fb4ff;font-family:Consolas,monospace}
  .login-points b{font-size:12px;font-weight:600}
  .login-points i{font-style:normal;font-size:11.5px;color:rgba(255,255,255,.58)}
  .login-foot{position:relative;z-index:1;font-size:10.5px;color:rgba(255,255,255,.42);letter-spacing:.02em}
  .login-panel{display:grid;place-items:center;padding:36px}
  .login-card{width:100%;max-width:410px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(16,24,40,.1);padding:34px 34px 28px}
  .login-head{margin-bottom:22px}
  .login-head .login-kicker{color:var(--accent)}
  .login-head h2{font-size:24px;margin:8px 0 5px;letter-spacing:-.02em}
  .login-head p{font-size:12px;color:var(--muted)}
  .login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .login-field label{font-size:11.5px;font-weight:600;color:#3d4a5c}
  .login-field .input{height:42px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;padding:0 12px;font-size:12.5px;color:var(--ink)}
  .login-field .input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,107,255,.12)}
  .login-error{min-height:16px;font-size:11.5px;color:var(--red);margin:2px 0 8px}
  .login-submit{width:100%;height:42px;justify-content:center;font-size:13px}
  .login-quick{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:7px}
  .login-quick-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .login-quick-h b{font-size:11.5px}
  .login-quick-h span{font-size:10.5px;color:var(--muted)}
  .quick{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
  .quick:hover{border-color:var(--accent);background:#f7faff}
  .quick b{font-size:12px;color:var(--ink)}
  .quick span{font-size:10.5px;color:var(--muted)}
  .top-user{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .top-user b{color:var(--ink);font-size:12px}
  @media (max-width:900px){
    .login-page{grid-template-columns:1fr}
    .login-hero{padding:32px 26px}
    .login-copy h1{font-size:30px}
    .login-points{display:none}
  }

  /* 移动端覆盖：放在最后，避免被后定义的组件样式反向覆盖 */
  @media (max-width:900px){
    .topbar .top-user{display:none}
    .topbar .role-select{max-width:104px;font-size:10.5px;padding:5px 6px}
    .topbar #logoutBtn{padding:5px 8px;font-size:11px}
    .login-hero:before,.login-hero:after{display:none}
  }
  @media (max-width:720px){
    .tbl{min-width:640px}
    .finding{padding:12px}
    .stage{padding:9px}
  }
</style>
</head>
<body>
<div style="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b45309;color:#fff;font:600 13px/30px -apple-system,Segoe UI,sans-serif;text-align:center;pointer-events:none;letter-spacing:.02em;">原型演示 · 页面内所有数字均为示意数据，非真实评测结果</div>
<div id="loginRoot"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg>
      </div>

function parseHash(){
  const raw = (location.hash || '#/dash').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if(!parts.length) return { name:'dash' };
  const [name, a, b, c] = parts;
  if(name === 'tasks') return { name:'tasks', taskId:a || null, stage:b || null };
  if(name === 'gov') return { name:'gov', tab:a || 'roles' };
  return { name };
}

function go(path){ location.hash = '#/' + path; }

function closeDrawer(){

}

const $ = (s, r=document) => r.querySelector(s);

function statePill(s, pct){
  if(s === 'done') return '<span class="pill done">✓ 已完成</span>';
  if(s === 'running') return '<span class="pill running">● 进行中' + (pct ? ' ' + pct + '%' : '') + '</span>';
  if(s === 'blocked') return '<span class="pill blocked">! 需修改</span>';
  return '<span class="pill todo">○ 未开始</span>';
}

function sevPill(s){
  const t = { high:'高危', medium:'中危', low:'低危' }[s] || s;
  return '<span class="sev ' + s + '">' + t + '</span>';
}

function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1800);
}

function stageSummary(t, key){
  const st = t.stages[key];
  return st.sum || '—';
}

function openHigh(t){
  return FINDINGS.filter(f => f.task === t.id && f.sev === 'high' && f.status !== 'ignored');
}

function policyHits(t){
  const hits = [];
  const on = (id) => { const r = POLICY.find(x => x.id === id); return r && r.on; };
  if(on('R1') && openHigh(t).length) hits.push({ id:'R1', note:'高危发现 ' + openHigh(t).length + ' 条' });
  const lines = t.diff.add + t.diff.del;
  if(on('R2') && lines > 500) hits.push({ id:'R2', note:'变更 ' + lines + ' 行' });
  if(on('R3') && t.firstRepo) hits.push({ id:'R3', note:'首次接入仓库' });
  return hits;
}

function releaseGate(t){
  if(t.released) return { ok:false, reason:'已放行，历史只读' };
  for(const k of ['intake','analyze','findings','fix']){
    if(t.stages[k].s !== 'done') return { ok:false, reason:'「' + STAGES.find(x=>x.key===k).label + '」未完成' };
  }
  if(t.stages.verify.s === 'blocked') return { ok:false, reason:'验证未通过，不能放行' };
  if(t.stages.verify.s !== 'done') return { ok:false, reason:'「验证」未完成' };
  return { ok:true, reason:'' };
}

function auditPush(action, target, note){
  AUDIT.unshift({ at:'刚刚', who: auth ? auth.name : '系统', action, target, note });

}

function currentStage(t){
  for(const s of STAGES){ if(t.stages[s.key].s !== 'done') return s.key; }
  return 'conclusion';
}

}

    <div class="grid-2">

        <div class="card-h"><span class="card-t">进行中的任务</span><a class="card-note" href="#/tasks">全部 →</a></div>

            <tr class="row" data-task="${t.id}">
              <td style="width:34%"><div class="repo">${t.repo}</div><div class="sub">#${t.pr} · ${t.title}</div></td>

  const k = currentStage(t);
  const st = t.stages[k];
  if(st.s === 'blocked') return '需修改';
  if(st.s === 'running') return '进行中';
  if(st.s === 'done') return '已完成';
  return '未开始';
}

function stageBar(t){
  return '<div class="stagebar">' + STAGES.map(s => {
    const st = t.stages[s.key].s;
    return '<i class="' + (st === 'done' ? 'done' : st === 'running' ? 'running' : st === 'blocked' ? 'blocked' : '') + '"></i>';
  }).join('') + '</div>';
}

function viewTasks(){

/* ==========================================================================
   视图：任务详情
   ========================================================================== */
function viewTask(t, stageKey){
  const key = stageKey || currentStage(t);
  const st = t.stages[key];
  const meta = STAGES.find(s => s.key === key);

  return `
    <div class="page-head" style="margin-bottom:12px">
      <div>
        <div class="eyebrow">${esc(t.repo)} · #${t.pr}</div>
        <h1>${esc(t.title)}</h1>
        <p class="subtitle">
          作者 ${t.author} · Reviewer ${t.reviewer} · 分支 <span class="mono">${t.branch}</span>
          · <span class="mono">+${t.diff.add} −${t.diff.del}</span>（${t.diff.files} 文件）
        </p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${statePill(t.stages[currentStage(t)].s, t.stages[currentStage(t)].pct)}
        ${can('release') && key === 'conclusion' && st.s !== 'done' ? '<button class="btn btn-ok" data-act="release" ' + (releaseGate(t).ok ? '' : 'disabled title="' + releaseGate(t).reason + '"') + '>放行</button>' : ''}
        ${can('release') && key === 'conclusion' && st.s !== 'done' ? '<button class="btn btn-danger" data-act="block" ' + (releaseGate(t).ok ? '' : 'disabled') + '>阻断</button>' : ''}
      </div>
    </div>

    <div class="stages">
      ${STAGES.map(s => {
        const sst = t.stages[s.key];
        const cls = [s.key === key ? 'sel' : '', sst.s].filter(Boolean).join(' ');
        return `<div class="stage ${cls}" data-stage="${s.key}">
          <div class="stage-h"><span class="stage-dot"></span>${s.label}</div>
          <div class="stage-s">${can('view') ? (sst.sum || s.desc) : stateLabel(sst)}</div>
          <div class="stage-t">${sst.at || ''}</div>
        </div>`;
      }).join('')}
    </div>

    ${nextStep(t, key)}

    <div class="split">
      <div class="card">
        <div class="card-h"><span class="card-t">${meta.label} · ${meta.desc}</span><span class="card-note">${stateLabel(st)}</span></div>
        <div class="card-b">${stageBody(t, key)}</div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><span class="card-t">变更摘要</span></div>
          <div class="card-b">
            <div class="kv"><span>文件</span><span>${t.diff.files} 个</span></div>
            <div class="kv"><span>新增 / 删除</span><span class="mono">+${t.diff.add} / −${t.diff.del}</span></div>
            <div class="kv"><span>风险等级</span><span>${sevPill(t.risk)}</span></div>
            <div class="kv"><span>任务当前阶段</span><span>${STAGES.find(s=>s.key===currentStage(t)).label}</span></div>
            <div class="kv"><span>正在查看</span><span>${meta.label}</span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><span class="card-t">阶段记录</span></div>
          <div class="card-b">
            <ul class="tl">
              ${STAGES.filter(s => t.stages[s.key].at).map(s => `<li>${s.label}<small>${t.stages[s.key].at}${can('view') ? ' · ' + (t.stages[s.key].sum || '') : ''}</small></li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    </div>`;
}

function stateLabel(st){
  if(st.s === 'done') return '已完成';
  if(st.s === 'running') return '进行中 ' + (st.pct || '') + '%';
  if(st.s === 'blocked') return '需修改';
  return '未开始';
}

function nextStep(t, key){
  const st = t.stages[key];
  if(!can('view')) return `<div class="nextstep">当前角色（${role().name}）只能查看元数据，业务内容已隐藏。</div>`;

  if(key === 'intake' && st.s === 'blocked')
    return `<div class="nextstep">接入失败：仓库无读权限。下一步 · 作者 · 补充仓库授权后重试。<button class="btn btn-sm" data-act="retry-intake">重新接入</button></div>`;
  if(key === 'analyze' && st.s !== 'done')
    return `<div class="nextstep">分析未完成。下一步 · 系统 · 重新运行分析。<button class="btn btn-sm btn-primary" data-act="run-analyze">运行分析</button></div>`;
  if(key === 'findings' && st.s !== 'done')
    return `<div class="nextstep">还有待复核发现。下一步 · Reviewer · 确认或忽略，然后进入修复。<button class="btn btn-sm" data-act="go-fix">去修复</button></div>`;
  if(key === 'fix' && st.s !== 'done')
    return `<div class="nextstep">补丁未完成。下一步 · 作者 · 生成补丁并提交验证。<button class="btn btn-sm btn-primary" data-act="gen-patch">生成补丁</button></div>`;
  if(key === 'verify' && st.s === 'blocked')
    return `<div class="nextstep">验证失败。下一步 · 作者 · 修复后重跑。<button class="btn btn-sm btn-primary" data-act="rerun-verify">重跑验证</button></div>`;
  if(key === 'verify' && st.s === 'todo')
    return `<div class="nextstep">${t.stages.fix.s === 'done' ? '补丁已就绪。下一步 · 作者 · 运行验证。' : '等待修复完成。'}<button class="btn btn-sm btn-primary" data-act="run-verify" ${t.stages.fix.s === 'done' ? '' : 'disabled'}>运行验证</button></div>`;
  if(key === 'conclusion' && st.s !== 'done'){
    const gate = releaseGate(t);
    return `<div class="nextstep">${can('release') ? (gate.ok ? '下一步 · Reviewer · 确认放行或阻断。' : '等待前置完成：' + gate.reason) : '等待 Reviewer 放行。'}</div>`;
  }
  if(key === 'conclusion' && st.s === 'done')
    return `<div class="nextstep">审查已结束（${t.released ? '已放行' : '已阻断'}）。<a class="btn btn-sm" href="#/tasks">返回任务列表</a></div>`;
  if(st.s === 'running') return `<div class="nextstep">「${meta.label}」进行中 ${st.pct || 0}%，完成后再继续。</div>`;

  const next = STAGES[STAGES.findIndex(x => x.key === key) + 1];
  if(next){
    const who = next.key === 'fix' || next.key === 'verify' ? '代码作者' : next.key === 'conclusion' ? 'Reviewer' : '系统';
    return `<div class="nextstep">下一步 · ${who} · 进入「${next.label}」。<button class="btn btn-sm" data-stage="${next.key}">去${next.label}</button></div>`;
  }
  return `<div class="nextstep">该阶段已完成。</div>`;
}

function stageBody(t, key){
  if(!can('view')){
    if(key === 'conclusion'){
      const hits = policyHits(t);
      return `<div class="infobox">平台管理员不查看业务内容，只保留放行依据：规则命中、责任人、时间。</div>
        <div class="kv" style="margin-top:12px"><span>规则命中</span><span>${hits.length ? hits.map(h=>h.id).join('、') : '未命中'}</span></div>
        <div class="kv"><span>结论</span><span>${t.released ? '已放行' : t.stages.conclusion.s === 'blocked' ? '已阻断' : '未放行'}</span></div>
        <div class="kv"><span>责任人</span><span>${t.released || t.stages.conclusion.s === 'blocked' ? (t.stages.conclusion.sum || '').replace(/^已(放行|阻断) · /, '') : '—'}</span></div>
        <div class="kv"><span>时间</span><span>${t.stages.conclusion.at || '—'}</span></div>`;
    }
    return `<div class="infobox">平台管理员不查看业务内容（代码、发现详情）。此处只保留元数据。</div>
      <div class="kv" style="margin-top:12px"><span>变更规模</span><span>${t.diff.files} 文件 / +${t.diff.add} −${t.diff.del}</span></div>
      <div class="kv"><span>阶段状态</span><span>${stateLabel(t.stages[key])}</span></div>`;
  }

  if(key === 'intake'){
    return `
      <div class="kv"><span>仓库</span><span>${esc(t.repo)}</span></div>
      <div class="kv"><span>变更集</span><span>#${t.pr}</span></div>
      <div class="kv"><span>分支</span><span class="mono">${t.branch}</span></div>
      <div class="kv"><span>作者</span><span>${t.author}</span></div>
      <div class="kv"><span>变更规模</span><span class="mono">+${t.diff.add} −${t.diff.del} · ${t.diff.files} 文件</span></div>
      <div style="margin-top:12px" class="warnbox">接入只拉取 diff 与必要上下文，不克隆整仓；失败时不生成任务版本。</div>`;
  }

  if(key === 'analyze'){
    return `
      <div class="kv"><span>静态扫描</span><span>ruff / 自定义规则 12 条</span></div>
      <div class="kv"><span>模型分析</span><span>gpt-6-sol · 温度 0.0</span></div>
      <div class="kv"><span>退出码</span><span class="mono">0</span></div>
      <div class="kv"><span>耗时</span><span>2m 18s</span></div>
      <div style="margin-top:12px">
        <div class="card-note" style="margin-bottom:8px">工具调用轨迹</div>
        <ul class="tl">
          <li>解析 diff<small>8 文件 · 跳过 2 个二进制</small></li>
          <li>静态规则匹配<small>12 条规则 · 命中 3</small></li>
          <li>模型逐块审查<small>12 个片段 · 用时 1m 40s</small></li>
        </ul>
      </div>`;
  }

  if(key === 'findings'){
    const list = FINDINGS.filter(f => f.task === t.id);
    if(!list.length) return '<div class="empty">本次审查没有发现</div>';
    return list.map(f => `
      <div class="finding" data-finding="${f.id}">
        <div style="flex:1;min-width:0">
          <div class="finding-t">${esc(f.title)}</div>
          <div class="finding-d">${esc(f.desc)}</div>
          <div class="finding-l">${f.file} · ${f.line}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          ${sevPill(f.sev)}
          <span class="card-note">${f.status === 'confirmed' ? '已确认' : f.status === 'ignored' ? '已忽略' : '待复核'}</span>
        </div>
      </div>`).join('');
  }

  if(key === 'fix'){
    return `
      <div class="card-note" style="margin-bottom:8px">建议补丁 · ${t.patch ? t.patch.file + ' · ' + t.patch.lines : '暂无补丁'}</div>
      <div class="code">${(t.patch ? t.patch.diff : [{ t:'  （尚未生成补丁）' }]).map(l => '<span class="ln ' + (l.add ? 'add' : l.del ? 'del' : '') + '">' + esc(l.t) + '</span>').join('')}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-sm" data-act="view-diff">查看完整 diff</button>
        <button class="btn btn-sm" data-act="copy-patch">复制补丁</button>
      </div>
      <div class="infobox" style="margin-top:12px">补丁只在本地预览；写入前自动留 .bak，Verify 未通过不标记修复成功。</div>`;
  }

  if(key === 'verify'){
    return `
      <div class="kv"><span>pytest</span><span>${t.verify ? t.verify.pytest : '未运行'}</span></div>
      <div class="kv"><span>ruff</span><span>${t.verify ? t.verify.ruff : '未运行'}</span></div>
      <div class="kv"><span>回归用例</span><span>${t.verify ? t.verify.cases : '未运行'}</span></div>
      ${t.stages.verify.s === 'blocked' ? '<div class="warnbox" style="margin-top:12px">失败证据已保留，修复未生效，系统不会把本次变更标记为「修复成功」。</div>' : ''}`;
  }

  if(key === 'conclusion'){
    const done = t.stages.conclusion.s === 'done';
    const hits = policyHits(t);
    const gate = releaseGate(t);
    const hitText = hits.length ? hits.map(h => h.id + '（' + h.note + '）').join('、') : '未命中';
    return `
      <div class="kv"><span>高危发现</span><span>${openHigh(t).length} 条（已忽略不计）</span></div>
      <div class="kv"><span>规则命中</span><span>${hitText}</span></div>
      <div class="kv"><span>放行前置</span><span>${gate.ok ? '已满足' : gate.reason}</span></div>
      <div class="kv"><span>当前结论</span><span>${done ? (t.released ? '已放行' : '已阻断') : '未放行'}</span></div>
      ${done ? '' : (hits.length
        ? '<div class="infobox" style="margin-top:12px">默认不阻断：本次命中 ' + hits.map(h=>h.id).join('、') + '，需要 Reviewer 显式放行。</div>'
        : '<div class="infobox" style="margin-top:12px">默认不阻断：未命中任何规则，满足前置后自动通过。</div>')}`;
  }

  return '';
}

      <div>
        <div class="eyebrow">POLICY</div>
        <h1>策略与规则</h1>
        <p class="subtitle">默认不阻断：未命中任何规则时，审查结论自动通过。</p>

function showLogin(){
  const app = document.querySelector('.app');
  const root = $('#loginRoot');
  if(app) app.style.display = 'none';
  root.style.display = '';
  root.innerHTML = loginHTML();

  $('#loginForm').onsubmit = (e) => {
    e.preventDefault();
    doLogin($('#loginUser').value.trim(), $('#loginPass').value);
  };
  document.querySelectorAll('[data-quick]').forEach(b => {
    b.onclick = () => {
      const acc = ACCOUNTS[b.dataset.quick];
      doLogin(acc.user, acc.pass);
    };
  });
  const u = $('#loginUser');
  if(u) u.focus();
}

function showApp(){
  $('#loginRoot').style.display = 'none';
  document.querySelector('.app').style.display = '';
}

function doLogin(user, pass){
  const acc = Object.values(ACCOUNTS).find(a => a.user === user && a.pass === pass);
  if(!acc){
    const el = $('#loginError');
    if(el) el.textContent = user ? '用户名或密码不正确（演示账号见下方快捷登录）' : '请输入用户名和密码';
    return;
  }
  auth = { role: acc.role, name: acc.name, at: Date.now() };
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch (e) {}
  store.role = acc.role;
  go(acc.role === 'admin' ? 'report' : 'dash');
  render();
  toast('欢迎，' + acc.name);
}

function doLogout(){
  closeDrawer();
  auth = null;
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  store.route = { name:'dash' };
  location.hash = '';
  render();
  toast('已退出登录');
}

/* ==========================================================================
   渲染
   ========================================================================== */
function render(){
  if(!auth){ showLogin(); return; }
  showApp();
  const r = store.route;
  // 管理员不查看业务内容：工作台/发现库直接转到质量报告（任务详情仍可看元数据）
  if(!can('view') && (r.name === 'dash' || r.name === 'findings')){
    location.hash = '#/report';
    return;
  }
  const roleEl = $('#roleSelect');
  roleEl.value = store.role;
  $('#avatar').textContent = role().avatar;
  $('#topName').textContent = auth.name;
  $('#topRole').textContent = role().name;

  renderNav();
  renderCrumb();

  if(r.name === 'tasks' && r.taskId && !task(r.taskId)){ location.hash = '#/tasks'; return; }

  let html = '';
  if(r.name === 'dash') html = viewDash();
  else if(r.name === 'tasks') html = r.taskId ? viewTask(task(r.taskId), (r.stage && STAGES.some(x => x.key === r.stage)) ? r.stage : null) : viewTasks();
  else if(r.name === 'findings') html = viewFindings();
  else if(r.name === 'report') html = viewReport();
  else if(r.name === 'policy') html = viewPolicy();
  else if(r.name === 'gov') html = viewGov(r.tab);
  else html = viewDash();

  $('#view').innerHTML = html;
  bind();
}

function renderCrumb(){
  const r = store.route;
  const map = { dash:'工作台', tasks:'审查任务', findings:'发现库', report:'质量报告', policy:'策略与规则', gov:'治理与审计' };
  let tail = map[r.name] || '工作台';
  if(r.name === 'tasks' && r.taskId) tail = r.taskId;
  $('#crumb').innerHTML = '<span>可信代码审查</span><span style="opacity:.4">/</span><b>' + tail + '</b>';
}

function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function bindFilters(){
  const q = $('#taskSearch');
  if(q){
    q.oninput = () => {
      const kw = q.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('tr[data-search]').forEach(tr => {
        const hit = !kw || tr.dataset.search.includes(kw);
        tr.style.display = hit ? '' : 'none';
        if(hit) shown++;
      });
      const empty = $('#taskEmpty');
      if(empty) empty.style.display = shown ? 'none' : '';
      const c = $('#taskCount');
      if(c) c.textContent = shown + ' / ' + TASKS.length + ' 个任务';
    };
  }

  const sev = $('#fSev'), st = $('#fStatus');
  if(sev && st){
    const apply = () => {
      let shown = 0;
      document.querySelectorAll('tr[data-sev]').forEach(tr => {
        const okS = sev.value === 'all' || tr.dataset.sev === sev.value;
        const okT = st.value === 'all' || tr.dataset.status === st.value;
        const hit = okS && okT;
        tr.style.display = hit ? '' : 'none';
        if(hit) shown++;
      });
      const empty = $('#findEmpty');
      if(empty) empty.style.display = shown ? 'none' : '';
    };
    sev.onchange = apply;
    st.onchange = apply;
  }
}

function bind(){
  document.querySelectorAll('[data-task]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); go('tasks/' + el.dataset.task); };
  });
  document.querySelectorAll('[data-stage]').forEach(el => {
    el.onclick = () => {
      const id = store.route.taskId;
      go('tasks/' + id + '/' + el.dataset.stage);
    };
  });
  document.querySelectorAll('[data-finding]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openFinding(el.dataset.finding); };
  });
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => go('gov/' + el.dataset.tab);
  });
  document.querySelectorAll('[data-rule]').forEach(el => {
    el.onclick = () => {
      const r = POLICY.find(x => x.id === el.dataset.rule);
      r.on = !r.on;
      render();
      toast(r.id + (r.on ? ' 已启用' : ' 已停用'));
    };
  });
  document.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => act(el.dataset.act);
  });
  bindFilters();

  // 键盘可达：行可聚焦，Enter 打开
  document.querySelectorAll('tr[data-task], tr[data-finding]').forEach(tr => {
    tr.tabIndex = 0;
    tr.onkeydown = (e) => {
      if(e.key === 'Enter'){
        if(tr.dataset.task) go('tasks/' + tr.dataset.task);
        else if(tr.dataset.finding) openFinding(tr.dataset.finding);
      }
    };
  });
}

/* ==========================================================================
   动作
   ========================================================================== */
function act(name){
  const id = store.route.taskId;
  const t = id ? task(id) : null;

  if(name === 'new-task'){ toast('原型演示：新建审查暂未接入'); return; }

  if(name === 'export-report'){
    downloadCsv('审查质量_' + new Date().toISOString().slice(0,10) + '.csv', [
      ['任务','仓库','PR','风险','当前阶段','文件数','新增','删除','已放行'],
      ...TASKS.map(x => [x.id, x.repo, '#'+x.pr, x.risk, STAGES.find(s=>s.key===currentStage(x)).label, x.diff.files, x.diff.add, x.diff.del, x.released ? '是' : '否']),
    ]);
    toast('已导出 ' + TASKS.length + ' 条');
    return;
  }

  if(name === 'export-audit'){
    downloadCsv('审计日志_' + new Date().toISOString().slice(0,10) + '.csv', [
      ['时间','操作人','动作','对象','说明'],
      ...AUDIT.map(a => [a.at, a.who, a.action, a.target, a.note]),
    ]);
    toast('已导出 ' + AUDIT.length + ' 条审计');
    return;
  }

  if(name === 'save-policy'){
    auditPush('修改规则', '策略集', POLICY.filter(r=>r.on).map(r=>r.id).join('、') + ' 启用');
    render();
    toast('规则已保存，已写入审计');
    return;
  }

  if(!t) return;

  if(name === 'run-analyze'){
    t.stages.analyze = { s:'running', pct:0, sum:'分析中…' };
    render();
    let p = 0;
    const timer = setInterval(() => {
      p += 20;
      t.stages.analyze = { s:'running', pct:p, sum:'分析中 ' + p + '%' };
      if(store.route.taskId === id) render();
      if(p >= 100){
        clearInterval(timer);
        let list = FINDINGS.filter(f => f.task === id);
        if(!list.length){
          FINDINGS.push({
            id: 'F-' + (2000 + Math.floor(Math.random()*900)), task:id,
            title:'新增分支缺少错误处理', sev:'medium', status:'pending',
            file:'src/app/handler.py', line:'L54–L61',
            desc:'异常分支只记录日志，未返回明确错误码，调用方无法区分失败类型。',
            code:[{ t:'  except Exception:' }, { t:'      log.warning("failed")' }],
          });
          list = FINDINGS.filter(f => f.task === id);
        }
        const hi = list.filter(f => f.sev === 'high').length;
        t.stages.analyze = { s:'done', at:'刚刚', sum:list.length + ' 发现 / ' + hi + ' 高危' };
        t.stages.findings = { s:'running', pct:0, sum:list.length + ' 条待复核' };
        // 动作有去处：完成后自动落到「发现」
        go('tasks/' + id + '/findings');
        toast('分析完成，已跳到发现');
      }
    }, 400);
    return;
  }

  if(name === 'retry-intake'){
    t.stages.intake = { s:'running', pct:50, sum:'重新接入…' };
    render();
    setTimeout(() => {
      t.stages.intake = { s:'done', at:'刚刚', sum:'2 文件 / +41 −9' };
      t.stages.analyze = { s:'todo', sum:'待运行' };
      if(store.route.taskId === id) render();
      toast('接入成功');
    }, 900);
    return;
  }

  if(name === 'go-fix'){ go('tasks/' + id + '/fix'); return; }

  if(name === 'gen-patch'){
    if(t.released){ toast('任务已放行，历史只读'); return; }
    if(store.role !== 'author'){ toast('只有代码作者可以生成补丁'); return; }
    t.stages.fix = { s:'running', pct:40, sum:'生成补丁…' };
    render();
    setTimeout(() => {
      t.stages.fix = { s:'done', at:'刚刚', sum:'补丁已应用' };
      t.verify = { result:'pass', pytest:'通过', ruff:'通过', cases:'全部通过' };
      t.stages.verify = { s:'running', pct:50, sum:'验证中…' };
      render();
      setTimeout(() => {
        t.stages.verify = { s:'done', at:'刚刚', sum:'pytest 通过' };
        go('tasks/' + id + '/verify');
        toast('补丁已应用，验证通过');
      }, 900);
    }, 700);
    return;
  }

  if(name === 'run-verify'){
    if(t.released){ toast('任务已放行，历史只读'); return; }
    if(store.role !== 'author'){ toast('只有代码作者可以运行验证'); return; }
    if(t.stages.fix.s !== 'done'){ toast('补丁未完成，不能验证'); return; }
    t.stages.verify = { s:'running', pct:50, sum:'验证中…' };
    render();
    setTimeout(() => {
      if(t.verify && t.verify.result === 'fail'){
        t.stages.verify = { s:'blocked', sum:'1 项失败：' + t.verify.cases };
        toast('验证失败，证据已保留');
      } else {
        t.stages.verify = { s:'done', at:'刚刚', sum:'pytest 通过' };
        toast('验证通过');
      }
      if(store.route.taskId === id) render();
    }, 900);
    return;
  }

  if(name === 'rerun-verify'){
    t.stages.verify = { s:'running', pct:50, sum:'验证中…' };
    render();
    setTimeout(() => {
      t.stages.verify = { s:'done', at:'刚刚', sum:'pytest 通过' };
      if(store.route.taskId === id) render();
      toast('验证通过');
    }, 1100);
    return;
  }

  if(name === 'release'){
    if(!can('release')){ toast('当前角色不能放行'); return; }
    const gate = releaseGate(t);
    if(!gate.ok){ toast(gate.reason); return; }
    const hits = policyHits(t);
    if(hits.length && !auth){ toast('需要登录后放行'); return; }
    t.released = true;
    t.stages.conclusion = { s:'done', at:'刚刚', sum:'已放行 · ' + (auth ? auth.name : '系统') };
    auditPush('放行', t.id, hits.length ? '命中 ' + hits.map(h=>h.id).join('、') + '，人工放行' : '未命中规则，自动通过');
    render();
    toast('已放行，已写入审计');
    return;
  }

  if(name === 'block'){
    if(!can('release')){ toast('当前角色不能阻断'); return; }
    t.released = false;
    t.stages.conclusion = { s:'blocked', at:'刚刚', sum:'已阻断 · ' + (auth ? auth.name : '系统') };
    t.stages.fix = { s:'blocked', sum:'按阻断意见返工' };
    t.stages.verify = { s:'todo', sum:'待重新验证' };
    t.verify = { result:null, pytest:'未运行', ruff:'未运行', cases:'未运行' };
    auditPush('阻断', t.id, '回退到修复阶段');
    render();
    toast('已阻断，回退到修复');
    return;
  }

  if(name === 'view-diff'){
    if(!t.patch){ toast('该任务暂无补丁'); return; }
    $('#drawerKicker').textContent = 'DIFF · ' + t.id;
    $('#drawerTitle').textContent = t.patch.file;
    $('#drawerBody').innerHTML =
      '<div class="kv"><span>位置</span><span class="mono">' + t.patch.lines + '</span></div>' +
      '<div class="code" style="margin-top:12px">' + t.patch.diff.map(l => '<span class="ln ' + (l.add ? 'add' : l.del ? 'del' : '') + '">' + esc(l.t) + '</span>').join('') + '</div>' +
      '<div class="infobox" style="margin-top:12px">仅展示最小修改；写入前自动留 .bak，验证未通过不标记修复成功。</div>';
    openDrawerPanel();
    return;
  }

  if(name === 'copy-patch'){
    if(!t.patch){ toast('该任务暂无补丁'); return; }
    const text = t.patch.diff.map(l => l.t).join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('补丁已复制'), () => toast('复制失败，请手动选择'));
    } else { toast('当前环境不支持剪贴板'); }
    return;
  }

}

/* ==========================================================================
   发现抽屉
   ========================================================================== */
function openFinding(fid){
  const f = finding(fid);
  if(!f) return;

  const ownerTask = task(f.task);
  const locked = ownerTask && ownerTask.released;

  if(locked){
    $('#drawerKicker').textContent = f.id + ' · 已归档';
    $('#drawerTitle').textContent = f.title;
    $('#drawerBody').innerHTML =
      '<div class="infobox">该任务已放行，发现记录转为只读，不能再确认或忽略。</div>' +
      '<div class="code" style="margin-top:12px">' + f.code.map(l => '<span class="ln">' + esc(l.t) + '</span>').join('') + '</div>' +
      '<p class="subtitle" style="margin-top:12px">' + esc(f.desc) + '</p>' +
      '<div class="kv"><span>位置</span><span class="mono">' + f.file + ' · ' + f.line + '</span></div>';
    openDrawerPanel();
    return;
  }

  if(!can('view')){
    $('#drawerKicker').textContent = f.id;
    $('#drawerTitle').textContent = '无权查看';
    $('#drawerBody').innerHTML = '<div class="infobox">平台管理员不查看业务内容。此处只保留该发现的元数据：严重度、所属任务、是否影响放行。</div>' +
      '<div class="kv" style="margin-top:12px"><span>严重度</span><span>' + sevPill(f.sev) + '</span></div>' +
      '<div class="kv"><span>所属任务</span><span class="mono">' + f.task + '</span></div>';
    openDrawerPanel();
    return;
  }

  $('#drawerKicker').textContent = f.id + ' · 发现详情';
  $('#drawerTitle').textContent = f.title;
  $('#drawerBody').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      ${sevPill(f.sev)}
      <span class="card-note">${f.status === 'confirmed' ? '已确认' : f.status === 'ignored' ? '已忽略' : '待复核'}</span>
    </div>
    <div class="code">${f.code.map(l => '<span class="ln' + (l.hot ? ' hot' : '') + '">' + esc(l.t) + '</span>').join('')}</div>
    <p class="subtitle" style="margin-top:12px">${esc(f.desc)}</p>
    <div class="kv"><span>位置</span><span class="mono">${f.file} · ${f.line}</span></div>
    <div class="kv"><span>所属任务</span><span class="mono">${f.task}</span></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-sm btn-primary" data-fact="confirm">确认</button>
      <button class="btn btn-sm" data-fact="ignore">忽略</button>
    </div>`;
  openDrawerPanel();

  document.querySelectorAll('[data-fact]').forEach(b => {
    b.onclick = () => {
      const kind = b.dataset.fact;
      const t2 = task(f.task);
      if(t2 && t2.released){ toast('任务已放行，历史只读'); return; }
      if(store.role === 'author' && t2 && t2.author !== auth.name){ toast('只能处理自己任务的发现'); return; }
      if(kind === 'confirm'){
        if(!can('decide') && !can('view')){ toast('当前角色不能确认'); return; }
        f.status = 'confirmed';
        auditPush('确认发现', f.id, '进入修复清单');
        toast('已确认 · 进入修复清单');
      } else {
        if(!can('ignore')){ toast('当前角色不能忽略'); return; }
        f.status = 'ignored';
        auditPush('忽略发现', f.id, '需在报告中说明理由');
        toast('已忽略 · 需在报告中说明');
      }
      $('#drawer').classList.remove('on');
      render();
    };
  });
}

/* ==========================================================================
   初始化
   ========================================================================== */
$('#logoutBtn').onclick = () => doLogout();
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    const d = $('#drawer');
    if(d && d.classList.contains('on')) d.classList.remove('on');
  }
});
$('#scrim').onclick = () => closeDrawer();
$('#drawerClose').onclick = () => $('#drawer').classList.remove('on');
$('#roleSelect').onchange = (e) => {
  const acc = ACCOUNTS[e.target.value];
  store.role = e.target.value;
  auth = { role: acc.role, name: acc.name, at: Date.now() };
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch (err) {}
  if(!can('view') && ['dash','tasks','findings'].includes(store.route.name)){
    go('report');
    toast('管理员不查看业务内容，已转到质量报告');
    return;
  }
  render();
  toast('已切换为 ' + role().name);
};

store.route = parseHash();
render();
</script>
</body>
</html>
