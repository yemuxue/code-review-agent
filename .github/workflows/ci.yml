name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint
        run: ruff check src/ --ignore E501,F841,E701,E702,E722,E741,E402

      - name: Type check
        run: >-
          mypy src/security src/harness/agent.py src/harness/jwt_auth.py
          src/storage/database.py src/memory/vector_store.py
          --ignore-missing-imports --explicit-package-bases

      - name: Test with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml

      - name: Eval dataset
        run: python -c "from tests.eval_dataset import EVAL_SAMPLES; print('Eval samples:', len(EVAL_SAMPLES), 'ready')"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
